<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | Market Bouaké</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 18px 5%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
            color: #222;
        }

        .logo span {
            color: #f57c00;
        }

        .container {
            width: 95%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .icon {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 30px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
            color: #222;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
            background: white;
            color: #222;
        }

        input:focus {
            border-color: #f57c00;
            box-shadow: 0 0 0 2px rgba(245,124,0,0.12);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
        }

        .forgot {
            text-align: right;
            margin-top: 8px;
        }

        .forgot a {
            color: #f57c00;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f57c00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .button:hover {
            background: #e56f00;
        }

        .button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: #fff1f1;
            color: #b00020;
            border: 1px solid #f0b5b5;
        }

        .message.success {
            display: block;
            background: #effaf1;
            color: #187333;
            border: 1px solid #b8dfbf;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #777;
            line-height: 1.6;
        }

        .register a {
            color: #f57c00;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #f57c00;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .card {
                padding: 22px;
            }

            .title {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Market <span>Bouaké</span>
        </a>

    </header>


    <main class="container">

        <div class="card">

            <div class="icon">
                🔐
            </div>

            <h1 class="title">
                Connexion
            </h1>

            <p class="subtitle">
                Connectez-vous à votre compte Market Bouaké.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="exemple@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Votre mot de passe"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                            aria-label="Afficher le mot de passe"
                        >
                            👁️
                        </button>

                    </div>


                    <div class="forgot">

                        <a
                            href="#"
                            id="forgotPassword"
                        >
                            Mot de passe oublié ?
                        </a>

                    </div>

                </div>


                <button
                    type="submit"
                    class="button"
                    id="loginButton"
                >
                    Se connecter
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <div class="register">

                Vous n'avez pas encore de compte ?

                <a href="inscription.html">
                    Créer un compte
                </a>

            </div>


            <a
                href="index.html"
                class="back"
            >
                ← Retour à Market Bouaké
            </a>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");

        const showPassword =
            document.getElementById("showPassword");

        const forgotPassword =
            document.getElementById("forgotPassword");


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        function clearMessage() {

            message.textContent = "";

            message.className = "message";

        }


        showPassword.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    showPassword.textContent = "🙈";

                } else {

                    passwordInput.type = "password";

                    showPassword.textContent = "👁️";

                }

            }
        );


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                clearMessage();

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showMessage(
                        "Veuillez remplir tous les champs.",
                        "error"
                    );

                    return;

                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Connexion...";


                try {

                    if (
                        typeof supabaseClient ===
                        "undefined"
                    ) {

                        throw new Error(
                            "La connexion à Supabase n'est pas configurée."
                        );

                    }


                    const { data, error } =
                        await supabaseClient.auth.signInWithPassword({

                            email: email,

                            password: password

                        });


                    if (error) {

    console.error("Erreur réelle Supabase :", error);

    showMessage(
        "❌ " + error.message,
        "error"
    );

    return;
}


                    if (!data || !data.user) {

                        showMessage(
                            "La connexion n'a pas pu être confirmée.",
                            "error"
                        );

                        return;

                    }


                    showMessage(
                        "✅ Connexion réussie ! Bienvenue sur Market Bouaké.",
                        "success"
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        1000
                    );


                } catch (error) {

                    console.error(error);

                    showMessage(
                        "❌ Une erreur est survenue. Vérifiez votre connexion et réessayez.",
                        "error"
                    );

                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Se connecter";

                }

            }
        );


        forgotPassword.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();

                clearMessage();


                const email =
                    emailInput.value.trim();


                if (!email) {

                    showMessage(
                        "Entrez votre adresse email avant de demander la réinitialisation du mot de passe.",
                        "error"
                    );

                    emailInput.focus();

                    return;

                }


                try {

                    const { error } =
                        await supabaseClient.auth.resetPasswordForEmail(

                            email,

                            {
                                redirectTo:
                                    window.location.origin +
                                    "/connexion.html"
                            }

                        );


                    if (error) {

                        console.error(error);

                        showMessage(
                            "❌ Impossible d'envoyer le lien de réinitialisation. " +
                            error.message,
                            "error"
                        );

                        return;

                    }


                    showMessage(
                        "📧 Un lien de réinitialisation a été envoyé à votre adresse email.",
                        "success"
                    );


                } catch (error) {

                    console.error(error);

                    showMessage(
                        "❌ Une erreur est survenue lors de la réinitialisation.",
                        "error"
                    );

                }

            }
        );

    </script>

</body>

</html>
