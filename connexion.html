<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | Market Bouaké</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
            min-height: 100vh;
        }

        /* HEADER /

        header {
            background: white;
            padding: 18px 5%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
            color: #222;
        }

        .logo span {
            color: #f57c00;
        }

        / CONTENU /

        .container {
            width: 95%;
            max-width: 480px;
            margin: 60px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #f57c00;
        }

        .button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f57c00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #e56f00;
        }

        .forgot {
            text-align: right;
            margin-top: 10px;
        }

        .forgot a {
            color: #f57c00;
            text-decoration: none;
            font-size: 13px;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #777;
        }

        .register a {
            color: #f57c00;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        / MOBILE */

        @media (max-width: 500px) {

            .container {
                margin: 35px auto;
            }

            .card {
                padding: 25px 20px;
            }

        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <a href="index.html" class="logo">
            Market <span>Bouaké</span>
        </a>

    </header>


    <!-- CONNEXION -->

    <main class="container">

        <div class="card">

            <div class="icon">
                🔐
            </div>

            <h1>
                Connexion
            </h1>

            <p class="subtitle">
                Connectez-vous à votre compte Market Bouaké.
            </p>


            <form onsubmit="login(event)">

                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="exemple@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Votre mot de passe"
                        required
                    >

                    <div class="forgot">

                        <a href="#">
                            Mot de passe oublié ?
                        </a>

                    </div>

                </div>


                <button
                    type="submit"
                    class="button"
                >
                    Se connecter
                </button>

            </form>


            <div class="register">

                Vous n'avez pas encore de compte ?

                <a href="inscription.html">
                    Créer un compte
                </a>

            </div>


            <a href="index.html" class="back">
                ← Retour à Market Bouaké
            </a>

        </div>

    </main>


    <script>

        function login(event) {

            event.preventDefault();

            alert(
                "La connexion réelle sera activée lorsque nous connecterons Market Bouaké à notre base de données."
            );

        }

    </script>

</body>
</html>
