<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration | Market Bouaké</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 18px 5%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
            color: #222;
        }

        .logo span {
            color: #f57c00;
        }

        .logout {
            border: none;
            background: #222;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout:hover {
            background: #444;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
            text-align: center;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            color: #f57c00;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #777;
            font-size: 14px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .card-title {
            margin-bottom: 20px;
            font-size: 21px;
        }

        .loading {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 35px 15px;
        }

        .request {
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .request:last-child {
            margin-bottom: 0;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .seller-name {
            font-size: 19px;
            font-weight: bold;
        }

        .shop-name {
            color: #f57c00;
            font-weight: bold;
            margin-top: 5px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status.pending {
            background: #fff3e0;
            color: #e56f00;
        }

        .status.approved {
            background: #eaf7ed;
            color: #187333;
        }

        .status.rejected {
            background: #fff1f1;
            color: #b00020;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .detail {
            background: #f7f7f7;
            padding: 11px;
            border-radius: 7px;
            font-size: 14px;
        }

        .detail strong {
            display: block;
            margin-bottom: 4px;
            color: #555;
            font-size: 12px;
        }

        .description {
            background: #f7f7f7;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .approve,
        .reject {
            border: none;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .approve {
            background: #198754;
            color: white;
        }

        .approve:hover {
            background: #157347;
        }

        .reject {
            background: #dc3545;
            color: white;
        }

        .reject:hover {
            background: #bb2d3b;
        }

        .refresh {
            border: none;
            background: #f57c00;
            color: white;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .refresh:hover {
            background: #e56f00;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 8px;
            margin-bottom: 18px;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #fff1f1;
            color: #b00020;
            border: 1px solid #f0b5b5;
        }

        .message.success {
            display: block;
            background: #effaf1;
            color: #187333;
            border: 1px solid #b8dfbf;
        }

        .rejection-box {
            display: none;
            margin-top: 15px;
        }

        .rejection-box textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            resize: vertical;
            font-family: Arial, sans-serif;
            margin-bottom: 10px;
        }

        .confirm-reject {
            border: none;
            background: #dc3545;
            color: white;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px 4%;
            }

            .logo {
                font-size: 21px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .request-header {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <header>

        <a href="index.html" class="logo">
            Market <span>Bouaké</span>
        </a>

        <button
            class="logout"
            id="logoutButton"
        >
            Se déconnecter
        </button>

    </header>


    <main class="container">

        <h1 class="title">
            🛡️ Administration
        </h1>

        <p class="subtitle">
            Gestion des demandes de vendeurs Market Bouaké
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <div class="stats">

            <div class="stat">

                <div
                    class="stat-number"
                    id="pendingCount"
                >
                    0
                </div>

                <div class="stat-label">
                    En attente
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="approvedCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Approuvés
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="rejectedCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Refusés
                </div>

            </div>

        </div>


        <div class="card">

            <h2 class="card-title">
                🏪 Demandes de vendeurs
            </h2>


            <button
                class="refresh"
                id="refreshButton"
            >
                🔄 Actualiser
            </button>


            <div
                id="requestsList"
            >
                <div class="loading">
                    Chargement des demandes...
                </div>
            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


 <script>

    const requestsList = document.getElementById("requestsList");
    const message = document.getElementById("message");

    const pendingCount = document.getElementById("pendingCount");
    const approvedCount = document.getElementById("approvedCount");
    const rejectedCount = document.getElementById("rejectedCount");

    const refreshButton = document.getElementById("refreshButton");
    const logoutButton = document.getElementById("logoutButton");


    function showMessage(text, type) {

        message.textContent = text;
        message.className = "message " + type;

    }


    function clearMessage() {

        message.textContent = "";
        message.className = "message";

    }


    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    async function checkAdmin() {

        const {
            data: {
                user
            },
            error
        } = await supabaseClient.auth.getUser();


        if (error) {

            console.error(error);

            showMessage(
                "Impossible de vérifier la connexion.",
                "error"
            );

            return false;

        }


        if (!user) {

            window.location.href = "connexion.html";

            return false;

        }


        /*
         * Le rôle admin que nous avons configuré
         * se trouve dans user_metadata.
         */

        const role = user.user_metadata?.role;


        console.log("Utilisateur connecté :", user.email);
        console.log("Rôle détecté :", role);


        if (role !== "admin") {

            document.body.innerHTML = `
                <div style="
                    min-height:100vh;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#f5f6f8;
                    padding:20px;
                    font-family:Arial,sans-serif;
                    text-align:center;
                ">

                    <div style="
                        background:white;
                        padding:35px;
                        border-radius:12px;
                        box-shadow:0 3px 15px rgba(0,0,0,0.08);
                        max-width:500px;
                    ">

                        <div style="font-size:45px;">
                            🔒
                        </div>

                        <h1 style="margin:15px 0;">
                            Accès refusé
                        </h1>

                        <p style="
                            color:#777;
                            line-height:1.5;
                        ">
                            Cette page est réservée à l'administration
                            de Market Bouaké.
                        </p>

                        <br>

                        <a
                            href="index.html"
                            style="
                                color:#f57c00;
                                text-decoration:none;
                                font-weight:bold;
                            "
                        >
                            ← Retour à Market Bouaké
                        </a>

                    </div>

                </div>
            `;

            return false;

        }


        return true;

    }


    async function loadRequests() {

        clearMessage();


        requestsList.innerHTML = `
            <div class="loading">
                Chargement des demandes...
            </div>
        `;


        try {

            const {
                data,
                error
            } = await supabaseClient
                .from("seller_requests")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error("Erreur Supabase :", error);

                showMessage(
                    "Impossible de charger les demandes : " +
                    error.message,
                    "error"
                );


                requestsList.innerHTML = `
                    <div class="empty">
                        Une erreur est survenue.
                    </div>
                `;

                return;

            }


            console.log("Demandes reçues :", data);


            updateStats(data || []);

            displayRequests(data || []);


        } catch (error) {

            console.error(error);

            showMessage(
                "Une erreur inattendue est survenue.",
                "error"
            );


            requestsList.innerHTML = `
                <div class="empty">
                    Une erreur est survenue.
                </div>
            `;

        }

    }


    function updateStats(requests) {

        let pending = 0;
        let approved = 0;
        let rejected = 0;


        requests.forEach(function(request) {

            if (request.status === "pending") {
                pending++;
            }

            if (request.status === "approved") {
                approved++;
            }

            if (request.status === "rejected") {
                rejected++;
            }

        });


        pendingCount.textContent = pending;
        approvedCount.textContent = approved;
        rejectedCount.textContent = rejected;

    }


    function displayRequests(requests) {

        if (!requests.length) {

            requestsList.innerHTML = `
                <div class="empty">
                    🎉 Aucune demande de vendeur pour le moment.
                </div>
            `;

            return;

        }


        requestsList.innerHTML = "";


        requests.forEach(function(request) {

            const article =
                document.createElement("div");

            article.className = "request";


            let statusText = "En attente";


            if (request.status === "approved") {
                statusText = "Approuvé";
            }


            if (request.status === "rejected") {
                statusText = "Refusé";
            }


            const date = request.created_at
                ? new Date(request.created_at)
                    .toLocaleDateString("fr-FR")
                : "";


            const description =
                request.shop_description
                ? `
                    <div class="description">

                        <strong>
                            Description de la boutique
                        </strong>

                        <br>

                        ${escapeHtml(request.shop_description)}

                    </div>
                `
                : "";


            const rejectionReason =
                request.rejection_reason
                ? `
                    <div class="description">

                        <strong>
                            Motif du refus
                        </strong>

                        <br>

                        ${escapeHtml(request.rejection_reason)}

                    </div>
                `
                : "";


            const actions =
                request.status === "pending"
                ? `
                    <div class="actions">

                        <button
                            class="approve"
                            onclick="approveSeller('${request.id}')"
                        >
                            ✅ Approuver
                        </button>

                        <button
                            class="reject"
                            onclick="showRejectBox('${request.id}')"
                        >
                            ❌ Refuser
                        </button>

                    </div>

                    <div
                        class="rejection-box"
                        id="reject-${request.id}"
                    >

                        <textarea
                            id="reason-${request.id}"
                            placeholder="Raison du refus (facultatif)"
                        ></textarea>

                        <button
                            class="confirm-reject"
                            onclick="rejectSeller('${request.id}')"
                        >
                            Confirmer le refus
                        </button>

                    </div>
                `
                : "";


            article.innerHTML = `

                <div class="request-header">

                    <div>

                        <div class="seller-name">
                            ${escapeHtml(request.first_name)}
                            ${escapeHtml(request.last_name)}
                        </div>

                        <div class="shop-name">
                            🏪 ${escapeHtml(request.shop_name)}
                        </div>

                    </div>


                    <span class="status ${escapeHtml(request.status)}">
                        ${statusText}
                    </span>

                </div>


                <div class="details">

                    <div class="detail">

                        <strong>
                            📧 Email
                        </strong>

                        ${escapeHtml(request.email)}

                    </div>


                    <div class="detail">

                        <strong>
                            📱 WhatsApp
                        </strong>

                        ${escapeHtml(request.phone)}

                    </div>


                    <div class="detail">

                        <strong>
                            📍 Ville
                        </strong>

                        ${escapeHtml(request.city)}

                    </div>


                    <div class="detail">

                        <strong>
                            📍 Quartier
                        </strong>

                        ${escapeHtml(request.district)}

                    </div>


                    <div class="detail">

                        <strong>
                            📅 Demande créée
                        </strong>

                        ${date}

                    </div>

                </div>


                ${description}

                ${rejectionReason}

                ${actions}

            `;


            requestsList.appendChild(article);

        });

    }


    function showRejectBox(id) {

        const box =
            document.getElementById("reject-" + id);


        if (!box) {
            return;
        }


        if (box.style.display === "block") {

            box.style.display = "none";

        } else {

            box.style.display = "block";

        }

    }


    async function approveSeller(id) {

        const confirmed =
            confirm(
                "Voulez-vous vraiment approuver ce vendeur ?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const {
                error
            } = await supabaseClient
                .from("seller_requests")
                .update({
                    status: "approved",
                    rejection_reason: null,
                    updated_at: new Date().toISOString()
                })
                .eq("id", id);


            if (error) {

                console.error(error);

                showMessage(
                    "❌ Impossible d'approuver le vendeur : " +
                    error.message,
                    "error"
                );

                return;

            }


            showMessage(
                "✅ Le vendeur a été approuvé.",
                "success"
            );


            await loadRequests();


        } catch (error) {

            console.error(error);

            showMessage(
                "Une erreur est survenue.",
                "error"
            );

        }

    }


    async function rejectSeller(id) {

        const reasonInput =
            document.getElementById("reason-" + id);


        const reason =
            reasonInput
            ? reasonInput.value.trim()
            : "";


        const confirmed =
            confirm(
                "Voulez-vous vraiment refuser cette demande ?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const {
                error
            } = await supabaseClient
                .from("seller_requests")
                .update({
                    status: "rejected",
                    rejection_reason:
                        reason || null,
                    updated_at:
                        new Date().toISOString()
                })
                .eq("id", id);


            if (error) {

                console.error(error);

                showMessage(
                    "❌ Impossible de refuser la demande : " +
                    error.message,
                    "error"
                );

                return;

            }


            showMessage(
                "❌ La demande du vendeur a été refusée.",
                "success"
            );


            await loadRequests();


        } catch (error) {

            console.error(error);

            showMessage(
                "Une erreur est survenue.",
                "error"
            );

        }

    }


    logoutButton.addEventListener(
        "click",
        async function() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "connexion.html";

        }
    );


    refreshButton.addEventListener(
        "click",
        loadRequests
    );


    async function startAdminPage() {

        if (
            typeof supabaseClient ===
            "undefined"
        ) {

            showMessage(
                "La connexion à Supabase n'est pas configurée.",
                "error"
            );

            return;

        }


        const isAdmin =
            await checkAdmin();


        if (!isAdmin) {
            return;
        }


        await loadRequests();

    }


    startAdminPage();

</script>
</body>

</html>
